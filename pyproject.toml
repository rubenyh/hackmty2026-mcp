[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supabase-fastmcp-starter"
version = "0.1.0"
description = "A safe read-only FastMCP server for allowlisted Supabase PostgreSQL data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2ui-agent-sdk>=0.5,<0.6",
    "fastmcp>=4.0.3,<5",
    "mcp>=2.2,<3",
    "psycopg[binary,pool]>=3.2.10,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.43,<3",
]

[project.optional-dependencies]
seed = [
    "supabase>=2.10,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
supabase-mcp = "supabase_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/supabase_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/AGENTS.md",
    "/ARCHITECTURE.md",
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "hatchling>=1.27",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/supabase_mcp"]
